name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          build() {
            GOOS_TARGET="$1"
            GOARCH_TARGET="$2"

            ARCHIVE_NAME="taildoctor_${VERSION}_${GOOS_TARGET}_${GOARCH_TARGET}"
            WORK_DIR="dist/${ARCHIVE_NAME}"

            mkdir -p "${WORK_DIR}"

            BINARY="${WORK_DIR}/taildoctor"

            if [[ "${GOOS_TARGET}" == "windows" ]]; then
              BINARY="${BINARY}.exe"
            fi

            echo "Building ${GOOS_TARGET}/${GOARCH_TARGET}..."

            CGO_ENABLED=0 \
            GOOS="${GOOS_TARGET}" \
            GOARCH="${GOARCH_TARGET}" \
              go build \
                -trimpath \
                -ldflags="-s -w" \
                -o "${BINARY}" \
                ./cmd/taildoctor

            cp README.md "${WORK_DIR}/"
            cp LICENSE "${WORK_DIR}/"

            if [[ "${GOOS_TARGET}" == "windows" ]]; then
              (
                cd dist
                zip -qr "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
              )
            else
              tar \
                -C dist \
                -czf "dist/${ARCHIVE_NAME}.tar.gz" \
                "${ARCHIVE_NAME}"
            fi

            rm -rf "${WORK_DIR}"
          }

          build darwin amd64
          build darwin arm64
          build linux amd64
          build linux arm64
          build windows amd64

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Show release contents
        run: ls -lh dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; updating assets."

            gh release upload \
              "${GITHUB_REF_NAME}" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create \
              "${GITHUB_REF_NAME}" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS \
              --title "Taildoctor ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
